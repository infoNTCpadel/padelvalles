services:
  padelvalles:
    build: .
    container_name: padelvalles
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - APP_URL=${APP_URL:-https://padelvalles.com}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-hola@padelvalles.com}
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.padelvalles.rule=Host(`padelvalles.com`) || Host(`www.padelvalles.com`)"
      - "traefik.http.routers.padelvalles.entrypoints=websecure"
      - "traefik.http.routers.padelvalles.tls.certresolver=letsencrypt"
      - "traefik.http.services.padelvalles.loadbalancer.server.port=3000"
